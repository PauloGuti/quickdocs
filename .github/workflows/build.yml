name: Build

# Compila QuickDocs en el sistema operativo real de cada destino — el .exe
# se construye en un Windows de GitHub, no cross-compilado desde Mac (evita
# el problema de "makensis" en Apple Silicon sin Rosetta).
#
# - Manual (Actions → Build → Run workflow): compila y deja los instaladores
#   como artefactos descargables desde esa misma ejecución, sin publicar nada.
# - Con un tag "vX.Y.Z": además crea un Release en GitHub con los archivos
#   adjuntos, listos para compartir con un link.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact-name: quickdocs-mac
            artifact-path: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            script: dist:win
            artifact-name: quickdocs-windows
            artifact-path: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (${{ matrix.script }})
        run: npm run ${{ matrix.script }}

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    # Solo cuando el workflow se disparó por un tag de versión (v1.0.0, etc.)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/quickdocs-mac/*
            artifacts/quickdocs-windows/*
          generate_release_notes: true
